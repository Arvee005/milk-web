# Production profile: PostgreSQL + Flyway.
#
# Activate with: --spring.profiles.active=prod
# or: ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#
# All database credentials come from the environment. There are no committed
# defaults; the application refuses to start if a required value is missing.

# JDBC connection. Each value is bound to an environment variable with no fallback,
# so an unset value leaves the property empty and the DataSource bean fails to build.
spring.datasource.url=${MILKWEB_DATABASE_URL}
spring.datasource.username=${MILKWEB_DATABASE_USERNAME}
spring.datasource.password=${MILKWEB_DATABASE_PASSWORD}

# Hibernate must NOT generate the schema in production. Flyway owns schema
# creation and evolution; Hibernate only validates that the entity mappings
# match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway runs before Hibernate validates the schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.schema-history-table=flyway_schema_history

# JWT secret and CORS are inherited from the base configuration and must be set
# through MILKWEB_JWT_SECRET and MILKWEB_CORS_ALLOWED_ORIGINS.

# Initial OWNER bootstrap. Disabled by default: both values must be set in the
# environment for the seeder to create anything, and the users table must be
# empty. Never reuse these values outside production.
milkweb.prod-owner.phone=${MILKWEB_PROD_OWNER_PHONE:}
milkweb.prod-owner.password=${MILKWEB_PROD_OWNER_PASSWORD:}