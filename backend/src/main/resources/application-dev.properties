spring.datasource.url=jdbc:h2:mem:milkdev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

milkweb.jwt.secret=dev-only-secret-key-must-be-at-least-256-bits-long-for-hs256

# Development-only owner seeding. Both values are read from the environment on every start and are never
# committed. When either is missing or invalid, DevOwnerSeeder logs how to set it and creates nothing.
milkweb.dev-owner.phone=${MILKWEB_DEV_OWNER_PHONE:}
milkweb.dev-owner.password=${MILKWEB_DEV_OWNER_PASSWORD:}

# Local frontend dev server origin permitted for cross-origin API calls.
milkweb.cors.allowed-origins=http://localhost:5173
