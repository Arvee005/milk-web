spring.application.name=milk-web-backend

milkweb.jwt.secret=${MILKWEB_JWT_SECRET}
milkweb.jwt.expiration-ms=86400000

# CORS: comma-separated list of allowed frontend origins. Empty by default so a
# misconfigured deployment does not silently allow every origin. Set explicitly
# for the environment that serves the frontend, e.g.
# MILKWEB_CORS_ALLOWED_ORIGINS=https://app.example.com
milkweb.cors.allowed-origins=${MILKWEB_CORS_ALLOWED_ORIGINS:}

# Health probes. Liveness reports only whether the app itself is running and never checks the database, so the
# uptime checker that keeps the free web service awake (GET /actuator/health/liveness) lets the database sleep.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
