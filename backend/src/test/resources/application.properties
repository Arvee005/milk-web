spring.datasource.url=jdbc:h2:mem:milktest
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

milkweb.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
milkweb.jwt.expiration-ms=3600000

milkweb.cors.allowed-origins=http://localhost:5173

# Tests share Spring contexts, so production-sized auth rate limits would let unrelated tests trip each other.
# AuthRateLimitTest sets its own small limits.
milkweb.rate-limit.login-failures-per-phone=1000
milkweb.rate-limit.login-failures-per-ip=1000
milkweb.rate-limit.registrations-per-ip=1000
