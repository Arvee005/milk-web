spring.datasource.url=jdbc:h2:mem:milktest
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

milkweb.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
milkweb.jwt.expiration-ms=3600000

milkweb.cors.allowed-origins=http://localhost:5173
